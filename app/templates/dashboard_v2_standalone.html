<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ dash.title|striptags }}{% if dash.dictionary %} × {{ dash.dictionary.name }}{% endif %} — дашборд Quotverba</title>
<script>try { const t = localStorage.getItem('qv-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
{{ fonts|safe }}
{{ css|safe }}
.v2 .standalone { max-width: 1320px; margin: 0 auto; padding: 24px 16px 48px; }
.v2 .standalone-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
</style>
<script>window.PlotlyGeoAssets = { topojson: { world_110m: {{ topojson|safe }} } };</script>
{% if cdn %}<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@{{ plotly_version }}/plotly.min.js"></script>
{% else %}<script>{{ plotly|safe }}</script>{% endif %}
<script>{{ appjs|safe }}</script>
</head>
<body class="v2">
<div class="standalone">
  <div class="standalone-bar no-print">
    <div class="theme-switch" role="group" aria-label="Тема">
        <button type="button" data-theme-set="light" title="Светлая тема" aria-label="Светлая тема"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></button>
        <button type="button" data-theme-set="auto" title="Как в системе" aria-label="Тема как в системе"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v11H3zM8 20h8M12 16v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button type="button" data-theme-set="dark" title="Тёмная тема" aria-label="Тёмная тема"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></button>
    </div>
  </div>
  {% include "_dashboard_v2_body.html" %}
</div>
</body>
</html>
